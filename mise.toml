[tools]
node = ["24", "22"]

[settings]
lockfile = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-x64", "macos-arm64", "windows-x64", "windows-arm64"]

[tasks.ci]
description = "Install locked dependencies, check code, test, and build"
run = [
  "npm ci",
  "npm run check",
  "npm test",
  "npm run build",

]
